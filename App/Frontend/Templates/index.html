<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Detection - Home</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        textarea { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; box-sizing: border-box; resize: vertical;}
        button { background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold;}
        button:hover { background: #005bb5; }
        .error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Claim Detection</h1>
        <p style="color: #666; margin-bottom: 25px;">Analyze natural language to determine if it contains a check-worthy factual claim.</p>
        
        <form method="POST">
            <textarea name="text" rows="5" placeholder="input text here" required></textarea>
            <button type="submit">Analyze Text</button>
        </form>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
