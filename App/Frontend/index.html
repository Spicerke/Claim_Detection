<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Detection</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; margin-top: 0; }
        .subtitle { color: #666; margin-bottom: 25px; text-align: center; }
        textarea { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; font-size: 15px; box-sizing: border-box; resize: vertical; }
        button { background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        button:hover:not(:disabled) { background: #005bb5; }
        button:disabled { background: #9bb8d4; cursor: not-allowed; }
        .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 5px; margin-top: 15px; font-size: 14px; }
        .result-box { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 20px; }
        .claim-true { color: #d32f2f; font-weight: bold; }
        .claim-false { color: #2e7d32; font-weight: bold; }
        .result-box p { margin: 0 0 10px; }
        .meta { font-size: 12px; color: #6c757d; margin: 0; }
        .meta span { margin-left: 15px; }
        hr { border-top: 1px solid #dee2e6; border-bottom: none; margin: 15px 0; }
        .hidden { display: none; }
        .counter { font-size: 12px; color: #888; text-align: right; margin: -14px 0 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Claim Detection</h1>
        <p class="subtitle">Analyze natural language to determine if it contains a fact-checkable claim.</p>

        <form id="claim-form">
            <textarea id="text-input" rows="5" maxlength="1000" placeholder="input text here" required></textarea>
            <div class="counter"><span id="char-count">0</span> / 1000</div>
            <button type="submit" id="submit-btn">Analyze Text</button>
        </form>

        <div id="error" class="error hidden"></div>

        <div id="result" class="result-box hidden">
            <p><strong>You entered:</strong><br><span id="result-text"></span></p>
            <p><strong>Classification:</strong> <span id="result-class"></span></p>
            <p><strong>Confidence:</strong> <span id="result-confidence"></span>%</p>
            <hr>
            <p class="meta">
                Processing Time: <span id="result-time"></span> ms
                <span>Cached: <span id="result-cached"></span></span>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
